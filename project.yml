name: Along
options:
  bundleIdPrefix: com.along
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.49.0   # 2.50+ requires Swift tools 6.1 (Xcode 16.3+); raise this once you upgrade Xcode
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Along:
    type: application
    platform: iOS
    sources:
      - path: Along
        excludes: ["Resources/Info.plist", "Resources/Along.entitlements"]
    dependencies:
      - package: Supabase
    entitlements:
      path: Along/Resources/Along.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: Along/Resources/Info.plist
      properties:
        CFBundleDisplayName: Along
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arm64]
        NSLocationWhenInUseUsageDescription: Along uses your approximate location to centre the map on you. It is never shared with other people.
        ITSAppUsesNonExemptEncryption: false
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.along.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  AlongTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AlongTests]
    dependencies:
      - target: Along
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.along.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Along:
    build:
      targets:
        Along: all
    test:
      targets: [AlongTests]
